packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true

allowBuilds:
  '@swc/core': true
  # ssh2/cpu-features/protobufjs are transitive testcontainers deps used only
  # for remote (SSH) Docker hosts, which this repo does not use. Denying
  # their install scripts avoids running unneeded native builds.
  cpu-features: false
  esbuild: true
  # Optional native speed-up of bullmq's msgpackr; it falls back to pure JS without it.
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# facturacionelectronicapy-xmlsign pins the abandoned `xmldom` 0.6.0 (critical GHSA-crh6-fp67-6883 and
# more, no patched release under that name) and xml2js 0.4.x (GHSA-776f-qx25-q3cc). Point them at the
# maintained fork already used by xml-crypto and at the patched xml2js; the signing specs prove it.
overrides:
  xmldom: npm:@xmldom/xmldom@0.8.15
  xml2js: 0.6.2

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-fastify@12.1.0'
  - '@nestjs/testing@12.1.0'
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - prettier@3.9.9
  - turbo@2.11.3
