packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true

allowBuilds:
  '@swc/core': true
  # ssh2/cpu-features/protobufjs are transitive testcontainers deps used only
  # for remote (SSH) Docker hosts, which this repo does not use. Denying
  # their install scripts avoids running unneeded native builds.
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-fastify@12.1.0'
  - '@nestjs/testing@12.1.0'
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - prettier@3.9.9
  - turbo@2.11.3
